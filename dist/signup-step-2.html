        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- preloader css -->
        <link rel="stylesheet" href="assets/css/preloader.min.css" type="text/css" />

        <!-- Bootstrap Css -->
        <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

        <!-- Icons Css -->
        <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

        <!-- Slick CSS -->
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

         <!-- nouisliderribute css -->
          <link rel="stylesheet" href="assets/libs/nouislider/nouislider.min.css">

        <!-- App Css-->
        <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

        <!-- Custom Css-->
        <link href="assets/css/custom.css" id="app-style" rel="stylesheet" type="text/css" />

    </head>

    <body>

    <!-- <body data-layout="horizontal"> -->
        <div class="auth-page min-vh-100 d-flex align-items-center justify-content-center bg-light">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="auth-full-page-content d-flex flex-column p-sm-5 p-4 bg-white shadow form-box my-5">
                      <div class="text-center">
                        <h3 class="fw-bold">Please upload your Emirates ID</h3>
                        <p class="text-muted small mt-2">We need this information to keep our platform secure.</p>
                      </div>

                      <div class="auth-content my-auto">
                          <!-- Progress Stepper -->
                        <div class="form-stepper mb-4">
                          <div class="step"></div>
                          <div class="step "></div>
                          <div class="step"></div>
                          <div class="step"></div>
                        </div>
                          <form class="mt-4 pt-2" action="#" method="post">
                            <div class="mb-3">
                              <h6>Emirates ID (Front)</h6>
                              <div class="upload-card">
                                <div class="text-center">
                                  <input type="file" class="file-input frontUpload" id="frontUpload" accept=".jpg,.jpeg,.png,.pdf">
                                  <label for="frontUpload" class="file-label"><i class="display-4 text-muted bx bx-file-blank"></i></label>
                                  <div class="uploaded-file" id="frontFile">
                                      <span class="file-name"></span>
                                      <span class="remove-btn" onclick="clearFile('frontUpload')">Remove</span>
                                  </div>
                                </div>
                              </div>
                              <p class="upload-instructions text-end mb-0">Upload in JPEG, PNG or PDF file format</p>
                            </div>
                            <div class="mb-3">
                              <h6>Emirates ID (Back)</h6>
                              <div class="upload-card">
                                <div class="text-center">
                                  <input type="file" class="file-input backUpload" name="backUpload" id="backUpload" accept=".jpg,.jpeg,.png,.pdf">
                                  <label for="backUpload" class="file-label"><i class="display-4 text-muted bx bx-file-blank"></i></label>
                                  <div class="uploaded-file" id="backFile">
                                      <span class="file-name"></span>
                                      <span class="remove-btn" onclick="clearFile('backUpload')">Remove</span>
                                  </div>
                                </div>
                              </div>
                              <p class="upload-instructions text-end mb-0">Upload in JPEG, PNG or PDF file format</p>
                            </div>

                            <div class="mt-5">
                              <button class="btn btn-primary w-100 text-uppercase fw-bold" type="submit">NEXT</button>
                            </div>
                          </form>
                      </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JAVASCRIPT -->
        <script src="assets/libs/jquery/jquery.min.js"></script>
        <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="assets/libs/metismenu/metisMenu.min.js"></script>
        <script src="assets/libs/simplebar/simplebar.min.js"></script>
        <script src="assets/libs/node-waves/waves.min.js"></script>
        <script src="assets/libs/feather-icons/feather.min.js"></script>
        <!-- pace js -->
        <script src="assets/libs/pace-js/pace.min.js"></script>
        <!-- pace js -->

        <!-- Chart JS -->
        <script src="assets/libs/chart.js/chart.umd.js"></script>
        <!-- chartjs init -->
        <script src="assets/js/pages/chartjs.init.js"></script>

        <!-- nouisliderribute js -->
        <script src="assets/libs/nouislider/nouislider.min.js"></script>
        <script src="assets/libs/wnumb/wNumb.min.js"></script>

        <!-- range slider init -->
        <script src="assets/js/pages/rangeslider.init.js"></script>

        <!-- Slick JS -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

        <script src="assets/js/custom.js"></script>
        <!-- password addon init -->
    </body>

</html>
