<!doctype html>
<html lang="en">

    <head>

        <meta charset="utf-8" />
        <title>TrukWise</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="" name="description" />
        <meta content="Hammad Hassan Hashmi" name="author" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- preloader css -->
        <link rel="stylesheet" href="assets/css/preloader.min.css" type="text/css" />

        <!-- Bootstrap Css -->
        <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
        <!-- Icons Css -->
        <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
        <!-- App Css-->
        <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

        <!-- Custom Css-->
        <link href="assets/css/custom.css" id="app-style" rel="stylesheet" type="text/css" />

    </head>

    <body>

    <!-- <body data-layout="horizontal"> -->
        <div class="auth-page min-vh-100 d-flex align-items-center justify-content-center bg-light">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="auth-full-page-content d-flex flex-column p-sm-5 p-4 bg-white shadow form-box my-5">
                      <div class="text-center">
                        <h3 class="fw-bold">One final step before your<br>account is ready!</h3>
                        <p class="text-muted small mt-2">Please provide the following identifying information</p>
                      </div>

                      <div class="auth-content my-auto">
                          <!-- Progress Stepper -->
                        <div class="form-stepper mb-4">
                          <div class="step active"></div>
                          <div class="step active"></div>
                          <div class="step"></div>
                          <div class="step"></div>
                        </div>
                          <form class="mt-4 pt-2" action="#" method="post">
                            <div class="mb-3">
                              <label for="fullName" class="form-label">Full Name</label>
                              <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Type Here">
                            </div>

                            <div class="mb-3">
                              <label for="email" class="form-label">Email address</label>
                              <input type="email" class="form-control" id="email" name="email" placeholder="Type Here">
                            </div>

                            <div class="mb-3">
                              <label for="mobNo" class="form-label">Mobile Number</label>
                              <input type="text" class="form-control" id="mobNo" name="mobNo" placeholder="Type Here">
                            </div>

                            <div class="mb-3">
                              <div class="d-flex align-items-start">
                                  <div class="flex-grow-1">
                                      <label for="password" class="form-label">Password</label>
                                  </div>
                              </div>
                              <div class="input-group auth-pass-inputgroup">
                                  <input type="password" class="form-control" id="password" name="password" placeholder="****************">
                              </div>
                            </div>

                            <div class="mb-3">
                              <div class="d-flex align-items-start">
                                <div class="flex-grow-1">
                                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                                </div>
                              </div>
                              <div class="input-group auth-pass-inputgroup">
                                  <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="****************">
                              </div>
                            </div>

                            <div class="mt-5">
                              <button class="btn btn-primary w-100 text-uppercase fw-bold" type="submit">NEXT</button>
                            </div>
                          </form>
                      </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JAVASCRIPT -->
        <script src="assets/libs/jquery/jquery.min.js"></script>
        <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="assets/libs/metismenu/metisMenu.min.js"></script>
        <script src="assets/libs/simplebar/simplebar.min.js"></script>
        <script src="assets/libs/node-waves/waves.min.js"></script>
        <script src="assets/libs/feather-icons/feather.min.js"></script>
        <!-- pace js -->
        <script src="assets/libs/pace-js/pace.min.js"></script>
        <!-- password addon init -->
    </body>

</html>
